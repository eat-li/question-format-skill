name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Plugin smoke test
        shell: bash
        run: |
          node -e "import('./lib/host.mjs').then(m => {
            if (m.name !== 'question-format') throw new Error('bad plugin name');
            if (!Array.isArray(m.inject) || !m.inject.includes('tools')) throw new Error('bad inject');
            const tools = [];
            m.apply({
              logger: { warn: (x) => console.error(x) },
              tools: { register: (t) => { tools.push(t); return () => {} } },
              skills: { registerProvider: () => () => {} }
            });
            const names = tools.map(t => t.name).join(',');
            if (names !== 'question_format_guard,question_format_repair,question_format_sanitize') {
              throw new Error('unexpected tools: ' + names);
            }
            console.log('plugin ok:', names);
          })"

      - name: CLI smoke test
        shell: bash
        run: |
          printf '' | node bin/qformat.mjs repair -
          node bin/qformat.mjs --version
          node bin/qformat.mjs --help > /dev/null
          printf '<p>求 $f(2)$。</p><p>答案：4</p>' > guard-smoke.html
          node bin/qformat.mjs guard guard-smoke.html --source-text '求 f(2)。' --field stem
          rm guard-smoke.html
          printf '<p>hi<script>x</script></p>' | node bin/qformat.mjs sanitize -
          printf '$x²$' | node bin/qformat.mjs repair - | node bin/qformat.mjs verify - --json > /dev/null
